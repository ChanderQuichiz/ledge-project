spring.application.name=catalogo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogo}
spring.datasource.username=${DB_USER:catalogo}
spring.datasource.password=${DB_PASSWORD:catalogo}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.flyway.enabled=true
spring.http.serviceclient.entradas.base-url=${ENTRADAS_URL:http://entradas:8080}
spring.http.serviceclient.entradas.connect-timeout=2s
spring.http.serviceclient.entradas.read-timeout=5s
