spring.datasource.url=jdbc:h2:mem:catalogo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.http.serviceclient.entradas.base-url=http://localhost:8081
spring.http.serviceclient.entradas.connect-timeout=2s
spring.http.serviceclient.entradas.read-timeout=5s
