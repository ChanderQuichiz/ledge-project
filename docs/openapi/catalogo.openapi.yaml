openapi: 3.0.3
info:
  title: Catalogo - API (frontend y otros microservicios)
  version: 1.0.0
  description: 'Cubre las HU de Catalogo que se exponen por HTTP: sedes y zonas (HU-01), eventos (HU-02 a HU-06),
    precios, tarifa dinamica y cotizacion (HU-07 a HU-09), catalogo publico (HU-04), organizadores (HU-29) y comision
    (HU-30). Las rutas /api/v1 las consume el frontend por el gateway y las /internal las consumen otros microservicios.'
servers:
- url: https://api.example.com
  description: API Gateway (rutas /api/v1, consumidas por el frontend)
- url: http://catalogo:8080
  description: Red interna (rutas /internal, consumidas por otros microservicios)
tags:
- name: Eventos
- name: Zonas
- name: Organizadores
- name: Sedes
- name: Catalogo
paths:
  /internal/eventos/{eventoId}/cotizaciones:
    post:
      tags:
      - Eventos
      operationId: cotizarEntradas
      summary: Calcular precio, cargo por servicio e IGV de una compra
      description: |
        Reservas lo llama al crear la reserva. Catalogo aplica la fase de venta vigente,
        la tarifa dinamica de la zona, el cargo por servicio (10% por entrada, minimo S/ 2.00
        y maximo S/ 15.00) y el IGV (18%, incluido en el precio). El descuento lo calcula
        Reservas con los cupones y se envia ya como monto para obtener el desglose final.
        Reservas congela el resultado en la reserva.
      x-hu:
      - HU-07
      - HU-08
      - HU-09
      x-llamado-por:
      - reservas
      parameters:
      - $ref: '#/components/parameters/EventoId'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotizacionSolicitud'
      responses:
        '200':
          description: Cotizacion calculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionRespuesta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: |
            La fase es PREVENTA con acceso restringido y el codigo de acceso falta o es invalido
            (codigo CODIGO_PREVENTA_INVALIDO).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El evento no esta EN_VENTA (codigo EVENTO_NO_EN_VENTA).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: |
            Solicitud valida pero no aplicable: ZONA_NO_HABILITADA o DESCUENTO_EXCEDE_SUBTOTAL.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
      security:
      - tokenServicio: []
      servers:
      - url: http://catalogo:8080
  /internal/eventos/{eventoId}/reglas:
    get:
      tags:
      - Eventos
      operationId: obtenerReglasEvento
      summary: Obtener las reglas vigentes de un evento
      description: |
        Entrega las condiciones del evento que otros servicios necesitan para aplicar sus
        propias reglas: estado, fechas, apertura de puertas, restriccion de edad, politica de
        cancelacion, reingreso, entradas nominativas, limite de compra, reprogramacion y
        cancelacion. Reservas lo usa para crear, cancelar y reembolsar; Entradas lo usa para
        validar en puerta y transferir.
      x-hu:
      - HU-02
      - HU-03
      - HU-05
      - HU-06
      - HU-33
      x-llamado-por:
      - reservas
      - entradas
      - identidad
      parameters:
      - $ref: '#/components/parameters/EventoId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Reglas del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReglasEvento'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - tokenServicio: []
      servers:
      - url: http://catalogo:8080
  /internal/eventos/{eventoId}/zonas/{zonaId}:
    get:
      tags:
      - Zonas
      operationId: obtenerZonaEvento
      summary: Obtener una zona del evento con sus puntos de acceso
      description: |
        Entradas lo usa en la validacion en puerta: una entrada solo se acepta en los puntos
        de acceso habilitados para su zona.
      x-hu:
      - HU-01
      x-llamado-por:
      - entradas
      parameters:
      - $ref: '#/components/parameters/EventoId'
      - name: zonaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Zona del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonaEvento'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - tokenServicio: []
      servers:
      - url: http://catalogo:8080
  /internal/eventos/{eventoId}/comision:
    get:
      tags:
      - Eventos
      operationId: obtenerComisionEvento
      summary: Obtener la comision fijada y la penalizacion de un evento
      description: |
        Pagos lo usa para liquidar al organizador. La comision queda fijada al publicar el
        evento. La penalizacion aplica solo si el organizador cancelo con menos de 7 dias
        de anticipacion (5% del recaudo bruto).
      x-hu:
      - HU-06
      - HU-30
      x-llamado-por:
      - pagos
      parameters:
      - $ref: '#/components/parameters/EventoId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Comision del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComisionEvento'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - tokenServicio: []
      servers:
      - url: http://catalogo:8080
  /internal/organizadores/{organizadorId}/cuenta-liquidacion:
    get:
      tags:
      - Organizadores
      operationId: obtenerCuentaLiquidacion
      summary: Obtener la cuenta verificada del organizador para pagarle
      description: |
        Pagos lo usa para pagar liquidaciones. Solo se paga a la cuenta bancaria verificada
        del organizador, y si la cuenta cambio hay una retencion de 72 horas.
      x-hu:
      - HU-29
      x-llamado-por:
      - pagos
      parameters:
      - name: organizadorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Cuenta de liquidacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaLiquidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - tokenServicio: []
      servers:
      - url: http://catalogo:8080
  /api/v1/sedes:
    post:
      tags:
      - Sedes
      operationId: crearSede
      summary: Registrar una sede
      description: Registra nombre, direccion, ciudad y aforo maximo legal.
      x-hu:
      - HU-01
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SedeCrear'
      responses:
        '201':
          description: Sede creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sede'
        '400':
          description: Solicitud con campos faltantes o con formato invalido
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problema'
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: AFORO_INVALIDO
          content:
            application/problem+json:
              schema: *id001
    get:
      tags:
      - Sedes
      operationId: listarSedes
      summary: Listar sedes
      description: Para que el organizador elija sede al crear un evento.
      x-hu:
      - HU-01
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      - ORGANIZADOR
      parameters:
      - &id005
        name: pagina
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - &id006
        name: tamanio
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: ciudad
        in: query
        required: false
        schema: &id007
          type: string
      responses:
        '200':
          description: Sedes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaSedes'
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
  /api/v1/sedes/{sedeId}:
    get:
      tags:
      - Sedes
      operationId: obtenerSede
      summary: Consultar una sede con sus zonas y accesos
      description: Incluye zonas y puntos de acceso.
      x-hu:
      - HU-01
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      - ORGANIZADOR
      parameters:
      - &id002
        name: sedeId
        in: path
        required: true
        schema: &id003
          type: string
          format: uuid
      responses:
        '200':
          description: Sede
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sede'
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
        '404':
          description: SEDE_NO_ENCONTRADA
          content:
            application/problem+json:
              schema: *id001
    delete:
      tags:
      - Sedes
      operationId: eliminarSede
      summary: Eliminar una sede
      description: No se elimina una sede con eventos futuros publicados.
      x-hu:
      - HU-01
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      parameters:
      - *id002
      responses:
        '204':
          description: Sede eliminada
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
        '404':
          description: SEDE_NO_ENCONTRADA
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: SEDE_CON_EVENTOS_FUTUROS
          content:
            application/problem+json:
              schema: *id001
  /api/v1/sedes/{sedeId}/desactivacion:
    post:
      tags:
      - Sedes
      operationId: desactivarSede
      summary: Desactivar una sede
      description: Solo si no tiene ventas.
      x-hu:
      - HU-01
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      parameters:
      - *id002
      responses:
        '200':
          description: Sede desactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sede'
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
        '404':
          description: SEDE_NO_ENCONTRADA
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: SEDE_CON_VENTAS
          content:
            application/problem+json:
              schema: *id001
  /api/v1/sedes/{sedeId}/zonas:
    post:
      tags:
      - Sedes
      operationId: crearZona
      summary: Agregar una zona a una sede
      description: El nombre es unico dentro de la sede y la suma de capacidades no puede superar el aforo maximo.
      x-hu:
      - HU-01
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZonaSedeCrear'
      responses:
        '201':
          description: Zona creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonaSede'
        '400':
          description: Solicitud con campos faltantes o con formato invalido
          content:
            application/problem+json:
              schema: *id001
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
        '404':
          description: SEDE_NO_ENCONTRADA
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: ZONA_DUPLICADA
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: AFORO_EXCEDIDO
          content:
            application/problem+json:
              schema: *id001
  /api/v1/sedes/{sedeId}/zonas/{zonaId}:
    delete:
      tags:
      - Sedes
      operationId: eliminarZona
      summary: Eliminar una zona
      description: No se elimina una zona con eventos futuros publicados.
      x-hu:
      - HU-01
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      parameters:
      - *id002
      - &id004
        name: zonaId
        in: path
        required: true
        schema: *id003
      responses:
        '204':
          description: Zona eliminada
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
        '404':
          description: ZONA_NO_ENCONTRADA
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: ZONA_CON_EVENTOS_FUTUROS
          content:
            application/problem+json:
              schema: *id001
  /api/v1/sedes/{sedeId}/zonas/{zonaId}/desactivacion:
    post:
      tags:
      - Sedes
      operationId: desactivarZona
      summary: Desactivar una zona
      description: Solo si no tiene ventas.
      x-hu:
      - HU-01
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      parameters:
      - *id002
      - *id004
      responses:
        '200':
          description: Zona desactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonaSede'
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
        '404':
          description: ZONA_NO_ENCONTRADA
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: ZONA_CON_VENTAS
          content:
            application/problem+json:
              schema: *id001
  /api/v1/sedes/{sedeId}/zonas/{zonaId}/asientos:
    put:
      tags:
      - Sedes
      operationId: definirAsientos
      summary: Definir los asientos de una zona numerada
      description: Fila y numero son unicos dentro de la zona. Permite marcar asientos inhabilitados y accesibles.
        Solo aplica a zonas NUMERADAS y la cantidad no puede superar la capacidad de la zona.
      x-hu:
      - HU-01
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      parameters:
      - *id002
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsientosDefinir'
      responses:
        '200':
          description: Asientos definidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsientosDefinidos'
        '400':
          description: Solicitud con campos faltantes o con formato invalido
          content:
            application/problem+json:
              schema: *id001
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
        '404':
          description: ZONA_NO_ENCONTRADA
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: ASIENTO_DUPLICADO
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: ZONA_NO_NUMERADA o CAPACIDAD_EXCEDIDA
          content:
            application/problem+json:
              schema: *id001
  /api/v1/sedes/{sedeId}/puntos-acceso:
    post:
      tags:
      - Sedes
      operationId: crearPuntoAcceso
      summary: Definir un punto de acceso de la sede
      description: Indica las zonas a las que da ingreso.
      x-hu:
      - HU-01
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PuntoAccesoCrear'
      responses:
        '201':
          description: Punto de acceso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoAcceso'
        '400':
          description: Solicitud con campos faltantes o con formato invalido
          content:
            application/problem+json:
              schema: *id001
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
        '404':
          description: SEDE_NO_ENCONTRADA
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: ZONA_NO_PERTENECE_A_SEDE
          content:
            application/problem+json:
              schema: *id001
  /api/v1/eventos:
    post:
      tags:
      - Eventos
      operationId: crearEvento
      summary: Crear un evento
      description: Solo un organizador VERIFICADO sin deudas vencidas. Nace en BORRADOR. La fecha de inicio debe
        ser al menos 72 horas posterior; la sede no puede tener otro evento superpuesto (2 horas de montaje y 2
        de desmontaje).
      x-hu:
      - HU-02
      security:
      - bearerAuth: []
      x-roles:
      - ORGANIZADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoCrear'
      responses:
        '201':
          description: Evento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '400':
          description: Solicitud con campos faltantes o con formato invalido
          content:
            application/problem+json:
              schema: *id001
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: SEDE_OCUPADA
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: FECHAS_INVALIDAS, ORGANIZADOR_NO_VERIFICADO u ORGANIZADOR_CON_DEUDAS
          content:
            application/problem+json:
              schema: *id001
    get:
      tags:
      - Catalogo
      operationId: listarEventos
      summary: Buscar eventos
      description: Solo eventos PUBLICADO, EN_VENTA o AGOTADO. Filtros por ciudad, fecha, categoria, rango de precio
        y organizador.
      x-hu:
      - HU-04
      security: []
      parameters:
      - *id005
      - *id006
      - name: ciudad
        in: query
        required: false
        schema: *id007
      - name: categoria
        in: query
        required: false
        schema: *id007
      - name: desde
        in: query
        required: false
        schema: &id008
          type: string
          format: date-time
      - name: hasta
        in: query
        required: false
        schema: *id008
      - name: precioMin
        in: query
        required: false
        schema: &id009
          $ref: '#/components/schemas/Monto'
      - name: precioMax
        in: query
        required: false
        schema: *id009
      - name: organizadorId
        in: query
        required: false
        schema: *id003
      responses:
        '200':
          description: Eventos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaEventos'
  /api/v1/eventos/{eventoId}:
    patch:
      tags:
      - Eventos
      operationId: actualizarEvento
      summary: Actualizar un evento
      description: En BORRADOR se puede cambiar todo; en un evento publicado solo nombre, descripcion y limite de
        compra (entre 1 y 10).
      x-hu:
      - HU-02
      - HU-05
      - HU-33
      security:
      - bearerAuth: []
      x-roles:
      - ORGANIZADOR
      parameters:
      - &id010
        name: eventoId
        in: path
        required: true
        schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoActualizar'
      responses:
        '200':
          description: Evento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '400':
          description: Solicitud con campos faltantes o con formato invalido
          content:
            application/problem+json:
              schema: *id001
        '401':
          description: Token ausente o invalido
          content:
            application/problem+json:
              schema: *id001
        '403':
          description: El rol no permite esta operacion (o el recurso es de otro usuario)
          content:
            application/problem+json:
              schema: *id001
        '404':
          description: EVENTO_NO_ENCONTRADO
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: CAMPO_NO_MODIFICABLE_EN_EVENTO_PUBLICADO o LIMITE_MENOR_AL_COMPRADO
          content:
            application/problem+json:
              schema: *id001
    get:
      tags:
      - Catalogo
      operationId: obtenerEvento
      summary: Ver el detalle de un evento
