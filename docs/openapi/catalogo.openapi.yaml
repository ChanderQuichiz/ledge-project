components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de usuario con el rol en el claim roles. Lo emite el flujo de autenticacion (fuera de las
        HU).
    tokenServicio:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de servicio para comunicacion entre microservicios.
  parameters:
    EventoId:
      name: eventoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador para trazar la solicitud entre servicios.
      schema:
        type: string
  responses:
    NoAutorizado:
      description: Token de servicio ausente o invalido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoEncontrado:
      description: El recurso no existe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
  schemas:
    Monto:
      type: number
      format: double
      minimum: 0
      multipleOf: 0.01
      description: Importe en soles (PEN) con 2 decimales.
    CotizacionSolicitud:
      type: object
      required:
      - zonaId
      - cantidad
      properties:
        zonaId:
          type: string
          format: uuid
        cantidad:
          type: integer
          minimum: 1
        descuento:
          allOf:
          - $ref: '#/components/schemas/Monto'
          default: 0
          description: Descuento total (cupon) sobre el subtotal de entradas, calculado por Reservas.
        codigoAccesoPreventa:
          type: string
          description: Solo si la fase vigente es PREVENTA con acceso restringido.
    CotizacionRespuesta:
      type: object
      required:
      - eventoId
      - zonaId
      - faseVenta
      - cantidad
      - precioUnitario
      - subtotalEntradas
      - descuento
      - cargoServicio
      - igvIncluido
      - total
      - moneda
      - calculadaEn
      properties:
        eventoId:
          type: string
          format: uuid
        zonaId:
          type: string
          format: uuid
        faseVenta:
          $ref: '#/components/schemas/FaseVenta'
        cantidad:
          type: integer
        precioUnitario:
          $ref: '#/components/schemas/Monto'
        subtotalEntradas:
          $ref: '#/components/schemas/Monto'
        descuento:
          $ref: '#/components/schemas/Monto'
        cargoServicio:
          $ref: '#/components/schemas/Monto'
        igvIncluido:
          $ref: '#/components/schemas/Monto'
        total:
          $ref: '#/components/schemas/Monto'
          description: Subtotal de entradas, menos descuento, mas cargo por servicio (IGV incluido).
        moneda:
          type: string
          enum:
          - PEN
        eventoExonerado:
          type: boolean
          description: Si es verdadero, el IGV solo se aplica al cargo por servicio.
        calculadaEn:
          type: string
          format: date-time
    ReglasEvento:
      type: object
      required:
      - eventoId
      - organizadorId
      - estado
      - fechaInicio
      - fechaFin
      - aperturaPuertas
      - restriccionEdad
      - politicaCancelacion
      - permiteReingreso
      - esNominativo
      - limiteCompraPorCliente
      - faseVentaActual
      properties:
        eventoId:
          type: string
          format: uuid
        organizadorId:
          type: string
          format: uuid
        estado:
          type: string
          enum:
          - BORRADOR
          - PUBLICADO
          - EN_VENTA
          - AGOTADO
          - FINALIZADO
          - CANCELADO
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        aperturaPuertas:
          type: string
          format: date-time
          description: No posterior a la fecha de inicio.
        restriccionEdad:
          type: string
          enum:
          - TODO_PUBLICO
          - '+14'
          - '+18'
        politicaCancelacion:
          type: string
          enum:
          - ESTANDAR
          - FLEXIBLE
          - NO_REEMBOLSABLE
          description: Fijada al publicar; no cambia despues.
        permiteReingreso:
          type: boolean
        maxReingresos:
          type: integer
          nullable: true
          minimum: 1
          description: Presente solo si permiteReingreso es verdadero.
        esNominativo:
          type: boolean
        limiteCompraPorCliente:
          type: integer
          minimum: 1
          maximum: 10
          description: Por defecto 6.
        faseVentaActual:
          allOf:
          - $ref: '#/components/schemas/FaseVenta'
          nullable: true
          description: Nulo si el evento aun no esta en venta.
        eventoExonerado:
          type: boolean
        reprogramacion:
          type: object
          nullable: true
          description: Presente si el evento fue reprogramado (maximo 2 veces).
          required:
          - numeroReprogramaciones
          - fechaAnterior
          - fechaNueva
          - notificadaEn
          properties:
            numeroReprogramaciones:
              type: integer
              minimum: 1
              maximum: 2
            fechaAnterior:
              type: string
              format: date-time
            fechaNueva:
              type: string
              format: date-time
            notificadaEn:
              type: string
              format: date-time
              description: Inicio del plazo de 7 dias para pedir reembolso.
        cancelacion:
          type: object
          nullable: true
          description: Presente si el evento fue cancelado por el organizador.
          required:
          - canceladoEn
          - motivo
          properties:
            canceladoEn:
              type: string
              format: date-time
            motivo:
              type: string
